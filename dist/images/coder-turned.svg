<svg
        class="coder-sprite"
        viewBox="0 0 800 800"
        role="img"
        aria-labelledby="sprite-title sprite-description"
        xmlns="http://www.w3.org/2000/svg"
      ><style>.coder-sprite{display:block;width:100%;height:100%;shape-rendering:crispEdges}
.laptop-bloom {
  opacity: 0.08;
  animation: bloom-pulse 2.4s steps(6, end) infinite;
  transform-box: fill-box;
  transform-origin: center;
}

.laptop-aura {
  opacity: 0.1;
  animation: aura-pulse 2.4s steps(6, end) infinite;
}

.laptop-lid {
  animation: lid-pulse 2.4s steps(6, end) infinite;
}

.laptop-panel {
  animation: panel-pulse 2.4s steps(6, end) infinite;
}

@keyframes bloom-pulse {
  0%,
  100% {
    opacity: 0.05;
    transform: scale(0.94);
  }
  50% {
    opacity: 0.7;
    transform: scale(1.06);
  }
}

@keyframes aura-pulse {
  0%,
  100% {
    opacity: 0.05;
  }
  50% {
    opacity: 0.72;
  }
}

@keyframes lid-pulse {
  0%,
  100% {
    fill: #242424;
  }
  50% {
    fill: #f4f4f4;
  }
}

@keyframes panel-pulse {
  0%,
  100% {
    fill: #111;
  }
  50% {
    fill: #fff;
  }
}

@media (prefers-reduced-motion: reduce) {
  .laptop-bloom,
  .laptop-aura,
  .laptop-lid,
  .laptop-panel {
    animation: none;
  }

  .laptop-bloom {
    opacity: 0.35;
  }

  .laptop-aura {
    opacity: 0.4;
  }
}
</style>
        <title id="sprite-title">Hooded coder looking back</title>
        <desc id="sprite-description">
          A monochrome pixel-art figure seated with their back toward us at a
          pulsing laptop, their hood turned over one shoulder to reveal only two
          pale eyes.
        </desc>

        <rect width="800" height="800" fill="#050505" />

