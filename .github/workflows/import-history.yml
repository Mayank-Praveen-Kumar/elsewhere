name: Import Elsewhere history
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-history.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore version commits and tags
        run: |
          git bundle verify elsewhere-history.bundle
          git fetch ./elsewhere-history.bundle refs/heads/main:refs/heads/imported-history 'refs/tags/*:refs/tags/*'
          git config user.name 'Mayank-Praveen-Kumar'
          git config user.email '343063819+Mayank-Praveen-Kumar@users.noreply.github.com'
          git checkout imported-history
          git merge --allow-unrelated-histories -s ours origin/main -m 'Import all 10 Elsewhere versions'
          git push origin HEAD:main --tags
