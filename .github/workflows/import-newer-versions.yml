name: Import newer Elsewhere versions
on:
  push:
    paths:
      - .github/workflows/import-newer-versions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append five source versions and tags
        shell: python
        run: |
          import pathlib, subprocess, tempfile, zipfile, shutil
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          git('config', 'user.name', 'Mayank-Praveen-Kumar')
          git('config', 'user.email', 'Mayank-Praveen-Kumar@users.noreply.github.com')
          versions = ['0.4.2', '0.4.3', '0.4.4', '0.4.5', '0.4.6']
          with tempfile.TemporaryDirectory() as temp:
              backup = pathlib.Path(temp)
              for version in versions:
                  name = f'elsewhere-v{version}.zip'
                  shutil.copyfile(name, backup / name)
              for version in versions:
                  tracked = subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0))
                  for name in filter(None, tracked):
                      path = pathlib.Path(name)
                      if path.is_file() or path.is_symlink():
                          path.unlink()
                  with zipfile.ZipFile(backup / f'elsewhere-v{version}.zip') as archive:
                      for item in archive.infolist():
                          relative = pathlib.PurePosixPath(item.filename)
                          assert relative.parts[0] == f'elsewhere-v{version}'
                          relative = pathlib.PurePosixPath(*relative.parts[1:])
                          assert not relative.is_absolute() and '..' not in relative.parts
                          if not relative.parts or item.is_dir():
                              continue
                          target = pathlib.Path(str(relative))
                          target.parent.mkdir(parents=True, exist_ok=True)
                          target.write_bytes(archive.read(item))
                  git('add', '-A')
                  git('commit', '-m', f'Elsewhere v{version}')
                  git('tag', f'v{version}')
              git('push', '--atomic', 'origin', 'HEAD:main', *[f'refs/tags/v{v}' for v in versions])
